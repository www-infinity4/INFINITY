<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Paragraph Gear and Quantum Color Routing</title>
  <desc id="desc">A paragraph gear menu routes an exact yellow source through a red doorway into a blue destination. A nested orb shows red surrounding blue and a yellow core.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".16"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b4232f"/></marker>
  </defs>
  <rect width="1200" height="760" fill="#f6f3eb"/>
  <text x="60" y="62" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#181818">Paragraph Gear &amp; Quantum Color Routing</text>
  <text x="60" y="94" font-family="Arial, sans-serif" font-size="17" fill="#4a4a4a">One source, preserved ancestry, fast routing into a focused destination</text>

  <g filter="url(#shadow)">
    <rect x="60" y="135" width="520" height="490" rx="22" fill="#ffffff"/>
  </g>
  <text x="92" y="180" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#181818">Conversation paragraph</text>
  <rect x="92" y="205" width="456" height="132" rx="14" fill="#fff4a8"/>
  <text x="116" y="242" font-family="Arial, sans-serif" font-size="16" fill="#302800">Exact source paragraph remains here.</text>
  <text x="116" y="270" font-family="Arial, sans-serif" font-size="16" fill="#302800">Yellow preserves the original wording and</text>
  <text x="116" y="298" font-family="Arial, sans-serif" font-size="16" fill="#302800">its link to this conversation.</text>
  <circle cx="514" cy="230" r="22" fill="#222222"/>
  <text x="514" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">⚙</text>

  <g filter="url(#shadow)">
    <rect x="250" y="285" width="280" height="290" rx="16" fill="#ffffff" stroke="#dedbd2"/>
  </g>
  <text x="274" y="323" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#181818">Paragraph Gear</text>
  <line x1="274" y1="341" x2="506" y2="341" stroke="#dedbd2"/>
  <text x="274" y="375" font-family="Arial, sans-serif" font-size="16" fill="#181818">↳ Discuss here</text>
  <text x="274" y="415" font-family="Arial, sans-serif" font-size="16" fill="#181818">＋ Start conversation</text>
  <text x="274" y="455" font-family="Arial, sans-serif" font-size="16" fill="#181818">⇢ Add to conversation</text>
  <text x="274" y="495" font-family="Arial, sans-serif" font-size="16" fill="#181818">▣ Add to project</text>
  <text x="274" y="535" font-family="Arial, sans-serif" font-size="16" fill="#181818">⌃ Fold older section</text>

  <path d="M575 375 C640 330, 680 330, 735 365" fill="none" stroke="#b4232f" stroke-width="9" marker-end="url(#arrow)"/>
  <circle cx="655" cy="340" r="42" fill="#d52b3a"/>
  <text x="655" y="347" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">RED</text>
  <text x="655" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#5a2530">known route</text>

  <g transform="translate(915 380)">
    <circle r="245" fill="#d52b3a" fill-opacity=".22" stroke="#b4232f" stroke-width="4"/>
    <circle r="158" fill="#2475d0" fill-opacity=".78"/>
    <circle r="76" fill="#f4cf34"/>
    <text x="0" y="-198" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#7e1823">RED ROUTING FIELD</text>
    <text x="0" y="-112" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">BLUE IMPORT LAYER</text>
    <text x="0" y="-6" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#302800">YELLOW</text>
    <text x="0" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#302800">EXACT SOURCE</text>
  </g>

  <rect x="60" y="670" width="1080" height="50" rx="12" fill="#ebe7dc"/>
  <text x="600" y="701" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#3d3d3d">Conceptual information architecture — not a measured particle-size model or physical explanation of red giants.</text>
</svg>
